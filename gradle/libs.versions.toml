# Version catalog for the SaryuLibCore + AntiChatManager multi-project build.
# Target: PaperMC 1.21 - 26.3, Java 21 bytecode.

[versions]
paper = "1.21-R0.1-SNAPSHOT"
adventure = "4.13.0"
hikaricp = "5.1.0"
sqlite = "3.45.2.0"
h2 = "2.5.252"
mysql = "8.4.0"
luckperms = "5.4"
placeholderapi = "2.11.5"
floodgate = "4.0.1-beta.1"
packetevents = "2.11.2"
shadow = "9.6.1"
junit = "5.11.4"
toml4j = "0.7.2"
re2j = "1.8"
bouncycastle = "1.78.1"

[libraries]
# --- Paper / Adventure ---
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
adventure-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventure-platform-paper = { group = "net.kyori", name = "adventure-platform-paper", version.ref = "adventure" }
adventure-serializer-json = { group = "net.kyori", name = "adventure-text-serializer-gson", version.ref = "adventure" }

# --- Database ---
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikaricp" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
h2 = { group = "com.h2database", name = "h2", version.ref = "h2" }
mysql-connector-j = { group = "com.mysql", name = "mysql-connector-j", version.ref = "mysql" }

# --- Optional integrations (compileOnly) ---
luckperms-api = { group = "net.luckperms", name = "api", version.ref = "luckperms" }
placeholderapi = { group = "me.clip", name = "placeholderapi", version.ref = "placeholderapi" }
floodgate-api = { group = "org.geysermc.floodgate", name = "floodgate-api", version.ref = "floodgate" }
packetevents-api = { group = "com.github.retrooper", name = "packetevents-api", version.ref = "packetevents" }

# --- Security & Utils (shaded into SaryuGuard) ---
toml4j = { group = "com.moandjiezana.toml", name = "toml4j", version.ref = "toml4j" }
re2j = { group = "com.google.re2j", name = "re2j", version.ref = "re2j" }
bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

# --- Tests ---
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "1.11.4" }

[plugins]
# Maintained fork (johnrengelman/shadow 8.1.1 breaks on Gradle 9 META-INF visits).
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
