name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Build release jars
        run: ./gradlew build -Prelease --no-daemon
      - name: Prepare release artifacts and SHA256SUMS
        run: |
          mkdir -p dist
          rm -f dist/*
          cp AntiChatManager/build/libs/AntiChatManager-*.jar dist/
          cp SaryuLibCore/build/libs/SaryuLibCore-*.jar dist/
          cp SaryuGuard/build/libs/SaryuGuard-*.jar dist/
          rm -f dist/*-sources.jar dist/*-slim.jar
          cd dist
          sha256sum *.jar > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            dist/*.jar
            dist/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
