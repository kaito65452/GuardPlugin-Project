name: build

on:
  push:
    branches: [dev, main]
  pull_request:

# Least privilege by default; jobs that need more declare it explicitly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin every action below to a full commit SHA (use `pinact run` or
      # Dependabot) before relying on this workflow for releases.
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test and forbidden-API scan
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            AntiChatManager/build/libs/*.jar
            SaryuLibCore/build/libs/*.jar

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - run: ./gradlew compileJava --no-daemon
      - uses: github/codeql-action/analyze@v3

  secrets-and-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            ./
