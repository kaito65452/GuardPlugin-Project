add-error: "<red>Gagal menambahkan: <gray>{error}"
remove-success: "<green>Perintah '<white>{cmd}</white>' berhasil dihapus dari blacklist."
remove-failed: "<red>Perintah '<white>{cmd}</white>' tidak ditemukan atau gagal dihapus."
blacklist-header: "<gold>=== Blacklist Commands ({count} entri) ==="
