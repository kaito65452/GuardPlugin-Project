# AntiChatManager Lite 4.0.0 Configuration
config-version: 4

blacklist:
  bypass:
    # Whether OP players automatically bypass the blacklist
    allow-op: true

# Emergency Blacklist (statis, tidak butuh database jika startup gagal atau cache kosong)
emergency-blacklist:
  - "op"
  - "deop"
  - "stop"
  - "reload"
  - "restart"
