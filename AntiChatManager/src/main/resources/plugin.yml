name: AntiChatManager
version: ${version}
api-version: '1.21'
main: id.saryu.antichatmanager.AntiChatManager
description: AntiChatManager Lite 4.0.0 - High-performance command blacklist.
author: Saryu
website: https://github.com/saryu
depend: [SaryuLibCore]
load: POSTWORLD

commands:
  acm:
    description: AntiChatManager Lite administration command.
    usage: /acm blacklist info
    aliases: [antichatmanager]

permissions:
  antichatmanager.admin:
    description: Full access to /acm commands.
    default: op
  antichatmanager.bypass:
    description: Bypass command blacklist rules.
    default: op
