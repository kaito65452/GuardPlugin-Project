# SaryuGuard Secret Configuration (HANYA untuk mode Passphrase atau override Env Var)
# Secara default, SaryuGuard membuat dan menggunakan file biner 'secret.key' (AES 256-bit).
# Gunakan file ini HANYA jika Anda ingin mengaktifkan mode passphrase berbasis Argon2id.

[encryption]
# Mode kunci: "auto_key" (default, memakai secret.key), "passphrase", atau "env"
mode = "auto_key"

# Jika mode = "env", sebutkan nama environment variable (default: SARYUGUARD_KEY)
env_var = "SARYUGUARD_KEY"

# Jika mode = "passphrase", tentukan passphrase di bawah ini (jangan disebarkan!)
passphrase = ""
salt = ""
